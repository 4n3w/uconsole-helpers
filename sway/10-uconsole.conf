# uConsole device layer for sway.
#
# Installs to ~/.config/sway/config.d/10-uconsole.conf, where the portable base
# config from the dotfiles repo picks it up via its trailing include. Everything
# here is specific to this hardware and would be wrong on any other machine.
#
# !! VALUES MARKED "VERIFY" ARE UNCONFIRMED. They are best guesses for a uConsole
# !! DSI panel and must be checked against the running device before being trusted:
# !!     swaymsg -t get_outputs
# !!     swaymsg -t get_inputs

### Display
#
# Output name CONFIRMED as DSI-1 (/sys/class/drm/card1-DSI-1, connected).
#
# Mode CONFIRMED as 720x1280 — the panel's native mode really is portrait, because
# it is mounted rotated. `mode` takes the PHYSICAL mode, before any transform, so
# this is 720x1280 and NOT the 1280x720 landscape you end up looking at.
#
# Transform CONFIRMED as 90. The first attempt used 270, which came up rotated 90
# degrees counter-clockwise; 90 and 270 are the only two landscape options for a
# portrait-native panel, so the other one is correct.
#
# Scale stays at 1 deliberately. The panel is ~294 PPI, which invites scaling, but
# on a 5" screen logical pixels are scarcer than they are small: scale 1.5 leaves
# only 853x480 to work with. Bigger fonts at scale 1 reads better for a
# terminal-first setup. Revisit if GUI apps end up too small to use.

output DSI-1 {
    mode 720x1280
    transform 90
    scale 1
    bg #191724 solid_color
}

### Input
#
# VERIFY: the trackball's device identifier. Get it from `swaymsg -t get_inputs`
# and replace the type-wide match below with the specific identifier if the
# generic rule catches the wrong device.

input type:pointer {
    natural_scroll disabled
    accel_profile flat
    pointer_accel 0.3
}

# Super key: handled below xkb, so there is deliberately nothing here.
#
# The built-in keyboard has no dedicated Super keycap. Its bottom row is
#     Fn  Ctrl  Alt(Cmd)  Space  Alt  Ctrl  Fn
# and the stock route to Super is Fn+Alt, the orange "Cmd" sublegend. The keyboard
# firmware resolves that chord internally and emits a clean KEY_RIGHTMETA, so $mod
# = Mod4 already works untouched — it is just a three-key press for every command.
#
# Right Alt is remapped to Super instead, in udev/90-uconsole-keyboard.hwdb. That
# sits at the evdev layer, below xkb, so it covers the TTY as well as sway and needs
# no xkb_options here. Keeping $mod as Mod4 also matters structurally: sway
# substitutes variables at parse time, so overriding $mod from config.d would land
# after every bindsym in the base config and change nothing.
#
# An earlier draft used `xkb_options caps:super` here. That was dropped once Caps
# turned out to be Fn+Tab on this board — a chord for a chord, no gain.

### Fonts and spacing
#
# The base config's 10px gaps cost ~4% of this panel in each direction. On a 5"
# screen that is real estate you notice losing.
#
# "JetBrains Mono" is the family name from Debian's fonts-jetbrains-mono. The
# Nerd Font build is a different family and is not packaged for bullseye.

font pango:JetBrains Mono 10

gaps inner 4
gaps outer 0

### Screen blanking
#
# Battery-powered, so unlike the desktop base this box DOES want idle blanking.
# The base config deliberately runs no swayidle; this adds one.
#
# Blanks the display after 5 min. No lock screen: swaylock has no installation
# candidate on bullseye, so $mod+Shift+q in the base config is a no-op here.
#
# `output * dpms off`, NOT `power off`. The `power` subcommand arrived in a later
# sway; 1.5's binary contains only `dpms`, so the newer spelling would fail
# silently at runtime — swayidle would fire and nothing would happen.
#
# Suspend is NOT wired up because it does not exist. /sys/power/state is empty and
# /sys/power/{mem_sleep,disk} are absent, so this kernel has neither CONFIG_SUSPEND
# nor CONFIG_HIBERNATION — not even freeze/s2idle. logind does not expose CanSuspend.
# This is settled, not pending a test: blanking is the only lever short of poweroff.

exec swayidle -w \
    timeout 300 'swaymsg "output * dpms off"' \
    resume     'swaymsg "output * dpms on"'

### Backlight
#
# The keyboard has brightness icons on Fn+< and Fn+>, and they were dead — not
# because the firmware is missing them, but because nothing was bound. They emit
# real KEY_BRIGHTNESSDOWN/KEY_BRIGHTNESSUP from a SEPARATE HID device,
# `ClockworkPI uConsole Consumer Control` (event3), not from the keyboard device.
# Confirmed by reading the raw evdev stream.
#
# Worth having rather than cosmetic: this kernel has no suspend at all, so the
# backlight is the only real power lever. Measured on-device it is ~46% of total
# draw at maximum — 1168 mA at level 9 against 627 mA at level 0.
#
# No sudo anywhere here: /sys/class/backlight/backlight@0/brightness is mode
# rw-rw-rw- on this board, so sway can write it directly through the helper.
#
# `~` expands because sway runs exec through sh.

bindsym XF86MonBrightnessUp   exec ~/uconsole/bin/backlight up
bindsym XF86MonBrightnessDown exec ~/uconsole/bin/backlight down

### Push-to-talk dictation
#
# Hold $mod+\, speak, release. bin/ptt records while held and types the
# transcript into the focused window through wtype.
#
# IT IS NOT Fn+\, AND IT CANNOT BE. That was the obvious choice and it is a dead
# end: reading the raw evdev stream shows Fn+\ and plain \ emitting the IDENTICAL
# scancode 70031 (HID usage 0x07/0x31), and the Consumer Control device stays
# silent throughout. The keyboard firmware simply does not map Fn on that key. So
# there is nothing for a hwdb rule to remap — hwdb rewrites scancodes, and there
# is only one scancode here. Do not spend an afternoon rediscovering this; the
# only route to a literal Fn+\ is reflashing the LeafLabs Maple keyboard MCU.
#
# Note this makes Fn+\ UNLIKE the two Fn chords that do work on this board:
# Fn+Alt emits a real KEY_RIGHTMETA and Fn+</> emit real brightness keys. The
# firmware resolves some chords and ignores others, and which is which can only
# be discovered by capturing the device.
#
# --no-repeat on the press half is load-bearing. Without it, holding the key
# autorepeats and fires `ptt start` dozens of times a second; the script is
# idempotent so it would survive, but it would spend the whole utterance forking
# processes that immediately exit.
#
# --release is what makes this push-to-talk rather than toggle-to-talk. sway 1.5
# does support it, along with --no-repeat — checked against the binary, not the
# docs, because the sway version here predates a lot of syntax.
#
# The two halves are separate detached processes sharing no state, so they hand
# off through a file in $XDG_RUNTIME_DIR; see bin/ptt's header.

bindsym --no-repeat $mod+backslash exec ~/uconsole/bin/ptt start
bindsym --release   $mod+backslash exec ~/uconsole/bin/ptt stop

# Toggle mode on the neighbouring key: tap $mod+/ to start, tap again to stop.
# Holding $mod+\ for a long dictation is genuinely tiring, and a paragraph is
# exactly when you least want to be holding a key down.
#
# --no-repeat matters MORE here than on the hold binding. Without it, holding
# $mod+/ for half a second autorepeats `ptt toggle` and flips recording on and
# off several times, ending in whichever state the last repeat happened to land
# on — a coin flip, and a confusing one, since the beeps would all fire.
#
# There is deliberately no --release half. `toggle` reads the current state and
# picks start or stop itself, so the press alone is the whole interaction.

bindsym --no-repeat $mod+slash exec ~/uconsole/bin/ptt toggle

### Speaking selected text
#
# Select any text, press $mod+p, and bin/say reads it aloud through piper. The
# other direction from push-to-talk: ptt is ears, this is mouth.
#
# `wl-paste -p` is the PRIMARY selection — what a drag-select fills — not the
# clipboard that $mod+c style copying uses. They are separate buffers, and using
# the wrong one is the classic "paste does nothing" confusion documented in
# CLAUDE.md's gotchas.
#
# IMPORTANT, and not a bug: inside a client with mouse tracking on — Claude Code,
# vim, btop — a plain drag never reaches the primary selection at all. HOLD SHIFT
# while dragging. foot's own README documents this; it is why selection appears
# to work in a plain shell and not in an application.
#
# `2>/dev/null` on wl-paste because it exits non-zero and prints to stderr when
# the selection is empty, which is a normal thing to happen, not an error.
#
# $mod+Shift+p stops it. Worth having rather than optional: piper speaks at
# roughly real time, so a carelessly selected paragraph is a minute of talking
# you cannot otherwise escape.

bindsym $mod+p       exec sh -c 'wl-paste -p 2>/dev/null | ~/uconsole/bin/say'
bindsym $mod+Shift+p exec ~/uconsole/bin/say --stop

### Terminal sizing
#
# foot's portable config sets size=12, tuned for a desktop monitor. Override
# lives in the foot config rather than here; see uconsole/tty/ notes.
